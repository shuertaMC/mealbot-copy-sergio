name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Docker is available on ubuntu-latest, so the testcontainers-based
      # integration tests run for real; fail rather than skip if it is not.
      - name: Test
        run: go test -race ./...
        env:
          MEALBOT_REQUIRE_DOCKER: "1"
