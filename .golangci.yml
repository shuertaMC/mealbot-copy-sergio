version: "2"
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - ineffassign
    - unused
  settings:
    staticcheck:
      # Existing error strings are capitalized (kept for identical API messages).
      checks: ["all", "-ST1000", "-ST1003", "-ST1005", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
